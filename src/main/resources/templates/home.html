<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <header>
        <h1>University Management System</h1>
        <div class="user-info">
            <span th:text="${name}">name</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </header>

    <main>
        <p>You are signed in as <strong th:text="${name}">name</strong>.</p>

        <h2>Manage</h2>

        <div class="cards">
            <div class="card" th:if="${isAdmin}">
                <h3>Admins</h3>
                <p>View, create, edit and delete admins.</p>
                <a href="/admins">Open</a>
            </div>

            <div class="card" th:if="${isAdmin or isTeacher}">
                <h3>Teachers</h3>
                <p>View, create, edit and delete teachers.</p>
                <a href="/teachers">Open</a>
            </div>

            <div class="card" th:if="${isAdmin or isStudent}">
                <h3>Students</h3>
                <p>View, create, edit and delete students.</p>
                <a href="/students">Open</a>
            </div>
        </div>
    </main>
</body>
</html>
