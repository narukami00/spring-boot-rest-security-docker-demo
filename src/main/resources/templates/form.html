<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/table.css}">
</head>
<body>
    <header>
        <h1>University Management System</h1>
        <div class="user-info">
            <a class="nav-link" href="/">Dashboard</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </header>

    <main class="narrow">
        <div class="toolbar">
            <h2 th:text="${title}">Form</h2>
            <a class="btn btn-plain" th:href="@{'/' + ${basePath}}">Back</a>
        </div>

        <div id="message"></div>

        <form id="recordForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   th:placeholder="${id == null} ? 'Required' : 'Leave blank to keep current'">
            <small th:if="${id != null}">Changing this is optional.</small>

            <div class="form-actions">
                <button type="submit" th:text="${id == null} ? 'Create' : 'Save'">Save</button>
            </div>
        </form>
    </main>

    <script th:inline="javascript">
    /*<![CDATA[*/
    const basePath = /*[[${basePath}]]*/ 'admins';
    const recordId = /*[[${id == null ? '' : id}]]*/ '';
    const csrfToken = /*[[${_csrf.token}]]*/ '';
    const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
    const isCreate = recordId === '';
    const api = '/api/' + basePath + (isCreate ? '' : '/' + recordId);

    const form = document.getElementById('recordForm');
    const messageBox = document.getElementById('message');

    const showMessage = (text, kind) => {
        messageBox.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'flash ' + kind;
        div.textContent = text;
        messageBox.appendChild(div);
    };

    const errorText = async (res) => {
        if (res.status === 401) { window.location = '/login'; return ''; }
        try {
            const body = await res.json();
            return body.message || ('Error ' + res.status);
        } catch (e) {
            return 'Error ' + res.status;
        }
    };

    // Editing: fetch the current record from the API rather than trusting page markup
    async function prefill() {
        if (isCreate) return;
        const res = await fetch(api, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) { showMessage(await errorText(res), 'error'); return; }
        const record = await res.json();
        document.getElementById('name').value = record.name || '';
        document.getElementById('email').value = record.email || '';
        document.getElementById('username').value = record.username || '';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const body = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            username: document.getElementById('username').value
        };
        const password = document.getElementById('password').value;
        if (password) body.password = password;   // omitted on edit => API keeps the current hash

        const res = await fetch(api, {
            method: isCreate ? 'POST' : 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            window.location = '/' + basePath;
        } else {
            showMessage(await errorText(res), 'error');
        }
    });

    prefill();
    /*]]>*/
    </script>
</body>
</html>
