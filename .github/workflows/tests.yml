name: Build and Test

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 17 + Maven dependency cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Fast, no database needed. Runs every test whose class name ends
      # in 'Tests' (Surefire's default includes).
      - name: Unit tests (fast, no database)
        run: ./mvnw --batch-mode test

      # Run all three integration tests; fail if no matching tests are found.
      - name: Integration tests (Testcontainers, MySQL 8.4)
        if: '!cancelled()'
        run: ./mvnw --batch-mode test -Dtest="*IT"

      # Surefire writes XML + plain-text reports for every test, pass or fail.
      # Uploading 'always()' keeps them available for inspection when red.
      - name: Collect test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
